<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Book Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h1 class="page-title" th:text="${book.id} != null ? 'Edit Book' : 'Add New Book'"></h1>

    <div class="card" style="max-width:600px;">
        <form th:action="@{/admin/books/save}" th:object="${book}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label>Title</label>
                <input type="text" th:field="*{title}" required>
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" th:field="*{author}" required>
            </div>
            <div class="form-group">
                <label>Genre</label>
                <input type="text" th:field="*{genre}">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" step="0.01" th:field="*{price}" required>
            </div>
            <div class="form-group">
                <label>Stock</label>
                <input type="number" th:field="*{stock}" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>Cover Image URL</label>
                <input type="text" th:field="*{imageUrl}">
            </div>
            <button class="btn" type="submit" style="width:100%;">Save Book</button>
        </form>
    </div>
</div>
</body>
</html>
