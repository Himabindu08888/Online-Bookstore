<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Cart - PageTurner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h1 class="page-title">My Cart</h1>

    <div class="card" th:if="${!cartItems.isEmpty()}">
        <div class="cart-row" th:each="item : ${cartItems}">
            <div>
                <strong th:text="${item.book.title}"></strong>
                <div style="color:var(--muted); font-size:0.85rem;" th:text="'₹' + ${item.book.price} + ' each'"></div>
            </div>
            <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" style="display:flex; align-items:center; gap:8px;">
                <input class="qty-input" type="number" name="quantity" th:value="${item.quantity}" min="0" th:max="${item.book.stock}">
                <button class="btn btn-sm btn-outline" type="submit">Update</button>
            </form>
            <div style="font-weight:700;" th:text="'₹' + ${item.subtotal}"></div>
            <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                <button class="btn btn-sm btn-danger" type="submit">Remove</button>
            </form>
        </div>

        <div class="cart-total">Total: ₹<span th:text="${total}"></span></div>
        <div style="text-align:right; margin-top:14px;">
            <a class="btn" th:href="@{/checkout}">Proceed to Checkout</a>
        </div>
    </div>

    <div class="empty-state" th:if="${cartItems.isEmpty()}">
        <p>Your cart is empty.</p>
        <a class="btn" th:href="@{/books}">Browse Books</a>
    </div>
</div>
</body>
</html>
