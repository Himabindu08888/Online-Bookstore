<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - PageTurner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card auth-form">
        <h2 class="page-title">Login</h2>

        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-error" th:if="${param.error}">Invalid email or password.</div>
        <div class="alert alert-success" th:if="${param.loggedout}">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button class="btn" type="submit" style="width:100%;">Login</button>
        </form>
        <p style="margin-top:16px; text-align:center;">
            Don't have an account? <a th:href="@{/register}" style="color:var(--primary); font-weight:600;">Register here</a>
        </p>
    </div>
</div>
</body>
</html>
