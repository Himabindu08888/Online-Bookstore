<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders - PageTurner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <h1 class="page-title">My Orders</h1>

    <div class="card" th:if="${!orders.isEmpty()}" th:each="order : ${orders}" style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap;">
            <div>
                <strong th:text="'Order #' + ${order.id}"></strong>
                &nbsp;<span class="status-badge" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span>
                <div style="color:var(--muted); font-size:0.85rem;" th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}"></div>
            </div>
            <div style="font-weight:700;" th:text="'₹' + ${order.totalAmount}"></div>
        </div>
        <ul>
            <li th:each="item : ${order.items}" th:text="${item.book.title} + ' x ' + ${item.quantity} + ' — ₹' + ${item.subtotal}"></li>
        </ul>
    </div>

    <div class="empty-state" th:if="${orders.isEmpty()}">
        <p>You haven't placed any orders yet.</p>
        <a class="btn" th:href="@{/books}">Browse Books</a>
    </div>
</div>
</body>
</html>
